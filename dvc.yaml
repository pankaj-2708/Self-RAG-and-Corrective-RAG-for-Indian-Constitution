stages:
  standalone_retriever:
    cmd: python ./evals/Component_level/0_retriever.py
    deps:
      - ./evals/Component_level/0_retriever.py
      - ./data/sample_test_set.csv       
    params:
      - standalone_retriever.test_set
      - standalone_retriever.output
      - standalone_retriever.vector_store_name
      - standalone_retriever.vector_store_collection_name
      - standalone_retriever.search_type
      - standalone_retriever.k
      - standalone_retriever.embeddings.model_name
      - standalone_retriever.models.region
      - standalone_retriever.region
      - standalone_retriever.llm_model_id
      - standalone_retriever.llm_temperature
      - standalone_retriever.RECALL_THRESHOLD
      - standalone_retriever.PRECISION_THRESHOLD
      - standalone_retriever.name
    outs:
      - ./data/standalone_retriever_eval.csv

  standalone_generator:
    cmd: python ./evals/Component_level/1_generator.py
    deps:
      - ./evals/Component_level/1_generator.py
      - ./data/sample_test_set.csv
    params:
      - standalone_generator.test_set
      - standalone_generator.output
      - standalone_generator.vector_store_name
      - standalone_generator.vector_store_collection_name
      - standalone_generator.search_type
      - standalone_generator.k
      - standalone_generator.embeddings.model_name
      - standalone_generator.models.region
      - standalone_generator.region
      - standalone_generator.llm_model_id
      - standalone_generator.llm_temperature
      - standalone_generator.FAITHFULNESS_THRESHOLD
      - standalone_generator.ANSWER_RELEVANCY_THRESHOLD
      - standalone_generator.name
    outs:
      - ./data/standalone_generator_eval.csv